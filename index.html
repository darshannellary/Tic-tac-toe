<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Tic Tac Toe</h1>

    <div class="mode-select" id="modeSelect">
      <button class="mode-btn active" data-mode="2p">2 Player</button>
      <button class="mode-btn" data-mode="cpu">Vs Computer</button>
    </div>

    <div class="status" id="status">X's turn</div>

    <div class="board" id="board">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>

    <div class="controls">
      <button id="resetBtn">New Round</button>
      <button id="resetScoreBtn">Reset Score</button>
    </div>

    <div class="scoreboard">
      <div class="score">
        <span class="score-label">X</span>
        <span class="score-value" id="scoreX">0</span>
      </div>
      <div class="score">
        <span class="score-label">Draws</span>
        <span class="score-value" id="scoreD">0</span>
      </div>
      <div class="score">
        <span class="score-label">O</span>
        <span class="score-value" id="scoreO">0</span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
